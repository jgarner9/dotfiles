general {
  lock_cmd = pidof hyprlock || hyprlock
  on_lock_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
}

# Turn the screen off after 15 minutes
listener {
  timeout = 900
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
}

# Lock the session after 20 minutes without input.
listener {
  timeout = 1200
  on-timeout = loginctl lock-session
}
