general {
  lock_cmd = pidof hyprlock || hyprlock
  # Start a fresh idle interval even if nobody provides input after waking.
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.force_idle(0)'
}

# Turn the screen off after 15 minutes
listener {
  timeout = 900
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
}

# Suspend after 20 minutes without input.
listener {
  timeout = 1200
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'; systemctl suspend || hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
