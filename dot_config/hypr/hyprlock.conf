$font = Noto Sans Mono

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(101411)
}

label {
    monitor =
    text = <span foreground="#aac29d">■</span> session locked
    color = rgb(93a096)
    font_size = 13
    font_family = $font
    position = 48, -26
    halign = left
    valign = top
}

label {
    monitor =
    text = $TIME
    color = rgb(e1e8df)
    font_size = 72
    font_family = $font
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date +"%A, %B %-d"
    color = rgb(93a096)
    font_size = 12
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER@homie
    color = rgb(aac29d)
    font_size = 11
    font_family = $font
    position = 0, 44
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 288, 44
    outline_thickness = 0
    rounding = 0
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    inner_color = rgb(171d18)
    font_color = rgb(e1e8df)
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="#93a096">password</span>
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}
