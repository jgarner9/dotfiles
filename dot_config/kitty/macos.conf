# macOS-only kitty settings, included from kitty.conf

# Retina screens render the same point size smaller than Linux does
font_size 13.0

# Left Option acts as Alt (zellij and bud shortcuts); right Option still
# types special characters like € and accented letters
macos_option_as_alt left

# quit the app when the last window closes, matching zellij's auto-exit
macos_quit_when_last_window_closed yes

# blend the title bar into the Tokyo Night background
macos_titlebar_color background

# Homebrew handles updates; skip the official build's own update popups
update_check_interval 0

# Editor for files opened from Finder: "." means $VISUAL/$EDITOR, which kitty
# reads from your login shell even on a GUI launch (bud, set in ~/.zshrc)
editor .
