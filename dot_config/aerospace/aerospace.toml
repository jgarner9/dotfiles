config-version = 2
persistent-workspaces = ["1", "2", "3", "4", "5"]
start-at-login = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

[mode.main.binding]
alt-enter = 'exec-and-forget open -na kitty'
alt-b     = "exec-and-forget osascript -e 'tell application \"Safari\" to make new document' -e 'tell application \"Safari\" to activate'"
alt-q     = 'close'
alt-f     = 'fullscreen'
alt-v     = 'layout floating tiling'
alt-e     = 'layout tiles horizontal vertical'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-tab = 'workspace-back-and-forth'

alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height +50'
k = 'resize height -50'
enter = 'mode main'
esc   = 'mode main'

[[on-window-detected]]                           # like windowrule = float
if.app-id = 'com.apple.finder'
run = 'layout floating'
